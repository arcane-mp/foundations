<html lang="en">

    @keyframes arrive { from{opacity:0;transform:translateX(18px)} to{opacity:1;transform:none} } @keyframes leave{to{opacity:0;transform:translateX(18px)}}
    @media (prefers-reduced-motion: reduce) { .toast,.toast.leave { animation:none; } .toast.leave { opacity:0; } #progress-fill { transition:none; } }
  </style>

    }

    function rangeControl(field,live){const wrap=node("div","range"),input=node("input"),out=node("output");input.type="range";input.name=field.name;input.min=String(field.min);input.max=String(field.max);if(field.step!==undefined)input.step=String(field.step);input.value=String(field.default??field.min);const paint=()=>{const span=field.max-field.min,ratio=span>0?(Number(input.value)-field.min)/span:0;input.style.setProperty("--fill",`${Math.round(ratio*1000)/10}%`);out.textContent=`${Number(input.value).toFixed(decimals(field.step))}${field.unit?` ${field.unit}`:""}`};input.addEventListener("input",()=>{paint();live?.(field,Number(input.value),true)});paint();wrap.append(input,out);return wrap}
    // Off-screen CEF never draws the browser's validation bubble, so errors are written under the field instead.
    function fieldMessage(field,control){if(field.type==="select")return field.required&&!control.value?"Choose an option.":"";if(field.type==="checkbox")return field.required&&!control.checked?"Tick this box to continue.":"";const v=control.validity;if(v.valid)return "";if(v.valueMissing)return "Enter a value.";if(v.badInput)return "Enter a number.";if(v.rangeUnderflow||v.rangeOverflow)return field.min!==undefined&&field.max!==undefined?`Use a value from ${field.min} to ${field.max}.`:v.rangeUnderflow?`Use ${field.min} or more.`:`Use ${field.max} or less.`;if(v.stepMismatch)return `Use steps of ${field.step??1}.`;return control.validationMessage}
    function fieldControl(field,live,edited){if(field.type==="select")return selectControl(field,value=>{edited();live?.(field,value)});if(field.type==="range")return rangeControl(field,live);let input;if(field.type==="textarea")input=node("textarea");else{input=node("input");input.type=field.type==="number"?"number":field.type==="checkbox"?"checkbox":field.type==="password"?"password":"text"}input.name=field.name;if(field.placeholder)input.placeholder=field.placeholder;if(field.required)input.required=true;if(field.min!==undefined)input.min=String(field.min);if(field.max!==undefined)input.max=String(field.max);if(field.step!==undefined)input.step=String(field.step);if(field.type==="checkbox")input.checked=field.default===true;else if(field.default!==undefined)input.value=String(field.default);input.addEventListener(field.type==="checkbox"?"change":"input",edited);if(live&&field.type==="checkbox")input.addEventListener("change",()=>live(field,input.checked));else if(live&&field.type==="number")input.addEventListener("change",()=>{if(input.value!==""&&input.checkValidity())live(field,Number(input.value))});return input}
    // Live dialogs report edits as they happen; a dragged slider is held to one report per 100 ms, its last value always sent.
    function liveSender(id){const last=new Map(),timers=new Map();const emit=(field,value)=>{if(current?.id===id)send("change",{id,name:field.name,value})};return(field,value,throttle=false)=>{clearTimeout(timers.get(field.name));if(!throttle){emit(field,value);return}const now=performance.now(),wait=100-(now-(last.get(field.name)||0));if(wait<=0){last.set(field.name,now);emit(field,value)}else timers.set(field.name,setTimeout(()=>{last.set(field.name,performance.now());emit(field,value)},wait))}}
    function renderInput(payload){heading(payload.title);const live=payload.live?liveSender(current.id):null;const form=node("form","fields");form.noValidate=true;const rows=[];
      const setError=(row,message)=>{row.box.classList.toggle("invalid",Boolean(message));row.text.textContent=message;if(message)row.target.setAttribute("aria-invalid","true");else row.target.removeAttribute("aria-invalid")};
      (payload.fields||[]).forEach((field,index)=>{const id=`hmp-field-${index}`,check=field.type==="checkbox",box=node("div","field"),row={field,box};const control=fieldControl(field,live,()=>{if(box.classList.contains("invalid"))setError(row,"")});
        row.target=field.type==="select"?control.querySelector(".select-button"):field.type==="range"?control.querySelector("input"):control;row.target.id=id;
        const name=node(check?"span":"label","field-label",field.label);if(!check)name.htmlFor=id;if(field.required){const star=node("span","required","*");star.setAttribute("aria-hidden","true");name.appendChild(star);row.target.setAttribute("aria-required","true")}
        const hint=field.description&&!check?node("span","hint",field.description):null;if(hint)hint.id=`${id}-hint`;const error=node("span","field-error");error.id=`${id}-error`;row.text=node("span");add(error,icon("error"),row.text);
        row.target.setAttribute("aria-describedby",[hint?.id,error.id].filter(Boolean).join(" "));
        if(check){const label=node("label","check");add(label,control,name);add(box,label,error)}else add(box,name,hint,control,error);form.appendChild(box);rows.push(row)});
      panel.appendChild(form);
      const submit=()=>{let first=null;for(const row of rows){const message=fieldMessage(row.field,form.elements.namedItem(row.field.name));setError(row,message);if(message&&!first)first=row}if(first){first.target.focus();return}const result={};for(const field of payload.fields||[]){const control=form.elements.namedItem(field.name);result[field.name]=field.type==="checkbox"?control.checked:field.type==="number"||field.type==="range"?Number(control.value):control.value}finish(result)};form.onsubmit=e=>{e.preventDefault();submit()};actions(payload.cancelLabel,payload.submitLabel,submit,payload.allowCancel!==false)}
    function renderContext(payload){heading(payload.title,payload.description);const list=node("div","options");for(const option of payload.options||[]){const button=node("button",`option ${option.tone||""} ${option.icon?"has-icon":""}`);button.disabled=option.disabled===true;const body=node("span","option-body");add(body,node("span","title",option.title),option.description?node("span","description",option.description):null);if(option.metadata?.length){const meta=node("span","metadata");for(const item of option.metadata){const part=node("span");add(part,node("b","",`${item.label}: `),document.createTextNode(item.value));meta.appendChild(part)}body.appendChild(meta)}if(option.icon){const image=node("img","option-icon");image.src=option.icon;image.alt="";image.onerror=()=>{image.remove();button.classList.remove("has-icon")};button.appendChild(image)}button.appendChild(body);button.onclick=()=>finish(option.id);list.appendChild(button)}panel.appendChild(list);actions(payload.cancelLabel,null,null,payload.canClose!==false)}
    function renderProgress(payload){heading("Please wait",payload.label);const track=node("div","progress-track"),fill=node("div");fill.id="progress-fill";track.setAttribute("role","progressbar");track.setAttribute("aria-valuemin","0");track.setAttribute("aria-valuemax","100");if(payload.label)track.setAttribute("aria-label",payload.label);track.appendChild(fill);const time=node("div","progress-time");panel.append(track,time);const began=performance.now();const tick=now=>{const elapsed=Math.max(0,now-began),ratio=Math.min(1,elapsed/payload.duration);fill.style.width=`${ratio*100}%`;track.setAttribute("aria-valuenow",String(Math.round(ratio*100)));time.textContent=`${Math.ceil(Math.max(0,payload.duration-elapsed)/1000)}s`;if(ratio>=1)finish(true);else progressFrame=requestAnimationFrame(tick)};progressFrame=requestAnimationFrame(tick);actions(payload.cancelLabel,null,null,payload.canCancel===true)}
    function renderRequest(request){if(!request?.id||current)return;current=request;panel.replaceChildren();overlay.classList.remove("transitioning");overlay.classList.add("open");if(request.type==="alert")renderAlert(request.payload);else if(request.type==="input")renderInput(request.payload);else if(request.type==="context")renderContext(request.payload);else if(request.type==="progress")renderProgress(request.payload)}
    function notify(payload){const tone=glyph[payload.tone]?payload.tone:"inform",toast=node("article",`toast ${tone}`),body=node("div");add(body,payload.title?node("strong","",payload.title):null,node("p"));const text=body.lastChild;add(text,node("span","sr-only",`${toneName[tone]}: `),document.createTextNode(String(payload.description??"")));add(toast,icon(tone),body);toasts.appendChild(toast);toastCount++;setTimeout(()=>{toast.classList.add("leave");setTimeout(()=>{toast.remove();toastCount--;if(!toastCount)send("idle")},190)},payload.duration||4500)}
    window.addEventListener("request",event=>renderRequest(event.detail));window.addEventListener("notify",event=>notify(event.detail||{}));window.addEventListener("clear",()=>{if(current){cancelAnimationFrame(progressFrame);current=null}closeSelects();overlay.classList.remove("open","transitioning");panel.replaceChildren()});
    document.addEventListener("click",()=>closeSelects());panel.addEventListener("scroll",()=>closeSelects());
    window.addEventListener("keydown",event=>{if(event.key!=="Escape"||!current)return;if(document.querySelector(".select-wrap.open")){event.preventDefault();closeSelects();return}const p=current.payload||{};const allowed=current.type==="alert"?p.cancel!==false:current.type==="input"?p.allowCancel!==false:current.type==="context"?p.canClose!==false:current.type==="progress"?p.canCancel===true:false;if(allowed){event.preventDefault();finish(current.type==="alert"?"cancel":current.type==="progress"?false:null)}});
    const demo=new URLSearchParams(location.search).get("dev");
    if(demo==="alert")renderRequest({id:"dev",type:"alert",payload:{title:"Confirm your choice",content:"This is the shared HMP alert surface. It keeps domain screens independent while giving every resource the same interaction language.",confirmLabel:"Confirm",cancelLabel:"Go back",cancel:true}});
    else if(demo==="input")renderRequest({id:"dev",type:"input",payload:{title:"Register an owl delivery",submitLabel:"Save delivery",cancelLabel:"Cancel",allowCancel:true,fields:[{name:"recipient",label:"Recipient",type:"text",placeholder:"Witch or wizard",required:true,description:"The name shown on the parcel."},{name:"route",label:"Delivery route",type:"select",default:"owlery",options:[{label:"Hogwarts Owlery",value:"owlery"},{label:"Hogsmeade Post",value:"hogsmeade"}]},{name:"count",label:"Number of parcels",type:"number",default:1,min:1,max:12},{name:"weight",label:"Parcel weight",type:"range",default:4,min:0,max:20,step:0.5,unit:"kg"},{name:"urgent",label:"Priority delivery",type:"checkbox",default:true},{name:"notes",label:"Delivery notes",type:"textarea",placeholder:"Optional instructions"}]}});
    else if(demo==="context")renderRequest({id:"dev",type:"context",payload:{title:"Potion station",description:"Choose an action for the selected cauldron.",canClose:true,cancelLabel:"Close",options:[{id:"brew",title:"Brew Wiggenweld",icon:"fw://resources/hmp-inventory/dist/icons/potion.svg",description:"Uses one Horklump Juice and Dittany Leaves.",tone:"success",metadata:[{label:"Time",value:"15 seconds"},{label:"Yield",value:"1 potion"}]},{id:"collect",title:"Collect ingredients",description:"Move finished ingredients to your inventory."},{id:"locked",title:"Advanced recipes",description:"Requires a higher potion skill.",disabled:true,tone:"warning"}]}});
    else if(demo==="progress")renderRequest({id:"dev",type:"progress",payload:{label:"Brewing Wiggenweld…",duration:15000,canCancel:true,cancelLabel:"Stop brewing"}});
    else if(demo==="notify"){notify({title:"Owl Post",description:"A new letter has arrived.",tone:"success",duration:30000});notify({description:"Your inventory is nearly full.",tone:"warning",duration:30000})}
    send("ready");
