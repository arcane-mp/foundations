<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="arcanum/tokens.css" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      button, input, textarea { font: inherit; }
      .hmp-hover { transition: background .08s ease, border-color .08s ease, filter .08s ease; }
      .hmp-hover:hover { border-color: var(--arc-gold-600) !important; filter: brightness(1.07); }
      .hmp-hover:focus-visible { outline: none; box-shadow: var(--arc-focus-ring) !important; }
      button:focus-visible, input:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--arc-focus-ring); }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
      @keyframes specks { 0%,100% { transform: translateY(0); opacity:.2 } 50% { transform:translateY(-22px); opacity:.85 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./creator.js"></script>
  </body>
</html>
