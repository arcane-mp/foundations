<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="arcanum/tokens.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: var(--arc-text-body);
        font: var(--arc-text-md) / var(--arc-leading-body) var(--arc-font-body);
        background:
          radial-gradient(ellipse at 50% 16%, rgba(201, 162, 90, 0.14), transparent 42%),
          linear-gradient(rgba(10, 8, 5, 0.9), rgba(10, 8, 5, 0.97));
      }
      body::after { content: ""; position: fixed; inset: var(--arc-space-5); border: 1px solid var(--arc-line); pointer-events: none; }
      main { width: min(950px, 88vw); max-height: 86vh; display: flex; flex-direction: column; }
      header { margin-bottom: var(--arc-space-8); text-align: center; }
      .eyebrow { color: var(--arc-gold-500); font: 600 var(--arc-text-xs) var(--arc-font-display); letter-spacing: 0.32em; text-transform: uppercase; }
      h1 { margin: var(--arc-space-3) 0 var(--arc-space-1); color: var(--arc-text-heading); font: 500 clamp(29px, 4vw, 44px) / var(--arc-leading-tight) var(--arc-font-display); letter-spacing: 0.04em; }
      #character { margin: 0; color: var(--arc-text-data); font-size: var(--arc-text-md); font-style: italic; }
      #locations { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: var(--arc-space-4); padding: var(--arc-space-1); overflow-y: auto; }
      .location {
        min-height: 180px;
        padding: var(--arc-space-6);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        color: inherit;
        font: inherit;
        background: linear-gradient(145deg, var(--arc-surface-raised), var(--arc-surface-window));
        border: 1px solid var(--arc-line-strong);
        border-radius: var(--arc-radius-lg);
        cursor: pointer;
        box-shadow: var(--arc-shadow-raised);
        transition: transform var(--arc-duration-base) var(--arc-ease-out), border-color var(--arc-duration-base) var(--arc-ease-out), background-color var(--arc-duration-base) var(--arc-ease-out);
      }
      .location:hover { transform: translateY(-3px); border-color: var(--arc-gold-500); }
      .location:focus-visible { outline: none; border-color: var(--arc-gold-400); box-shadow: var(--arc-shadow-raised), var(--arc-focus-ring); }
      .location:active { transform: translateY(-1px); border-color: var(--arc-gold-600); transition-duration: var(--arc-duration-fast); }
      .location.last { background: linear-gradient(145deg, rgba(201, 162, 90, 0.16), var(--arc-surface-window)); border-color: var(--arc-gold-600); }
      .kind { color: var(--arc-gold-500); font: 600 var(--arc-text-xs) var(--arc-font-display); letter-spacing: 0.2em; text-transform: uppercase; }
      .name { margin: var(--arc-space-5) 0 var(--arc-space-2); color: var(--arc-text-heading); font: 500 var(--arc-text-xl) / var(--arc-leading-tight) var(--arc-font-display); letter-spacing: 0.02em; }
      .description { min-height: 38px; color: var(--arc-text-data); font-size: var(--arc-text-sm); line-height: var(--arc-leading-body); }
      .choose { margin-top: var(--arc-space-4); color: var(--arc-text-muted); font: 600 var(--arc-text-xs) var(--arc-font-display); letter-spacing: 0.2em; text-transform: uppercase; transition: color var(--arc-duration-base) var(--arc-ease-out); }
      .location:hover .choose, .location:focus-visible .choose { color: var(--arc-gold-400); }
      #error { min-height: 20px; margin-top: var(--arc-space-4); color: var(--arc-danger); text-align: center; font-size: var(--arc-text-sm); }
      @media (prefers-reduced-motion: reduce) { .location:hover, .location:active { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">Choose Your Destination</div>
        <h1>Where Will Your Story Continue?</h1>
        <p id="character"></p>
      </header>
      <section id="locations"></section>
      <div id="error" role="alert"></div>
    </main>
    <script>
      const send = (event, payload) => callEvent(event, JSON.stringify(payload || {}));
      const list = document.getElementById("locations");
      const error = document.getElementById("error");
      let model = { character: {}, locations: [] };

      function render() {
        document.getElementById("character").textContent = `Entering the world as ${model.character?.name || "your character"}`;
        error.textContent = model.locations?.length ? "" : (model.emptyMessage || "No destinations are currently available. Please contact the server administrator.");
        list.textContent = "";
        for (const location of model.locations || []) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "location" + (location.kind === "last" ? " last" : "");
          button.innerHTML = '<div><div class="kind"></div><div class="name"></div><div class="description"></div></div><div class="choose">Travel here</div>';
          button.querySelector(".kind").textContent = location.kind === "last" ? "Continue" : "Spawn Location";
          button.querySelector(".name").textContent = location.label;
          button.querySelector(".description").textContent = location.description || (location.kind === "last" ? "Return to where this character last left the world." : "Begin here.");
          button.addEventListener("click", () => send("select", { key: location.key }));
          list.appendChild(button);
        }
      }

      window.addEventListener("hmp-spawn:model", (event) => { model = event.detail || model; render(); });
      window.addEventListener("hmp-spawn:error", (event) => { error.textContent = event.detail?.message || "That location is unavailable."; });
      send("ready");
    </script>
  </body>
</html>
